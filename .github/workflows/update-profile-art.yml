name: Update profile art

on:
  schedule:
    # every day at 04:17 UTC (09:17 in Karachi)
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

# never let two refreshes race on the same branch
concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull fresh data from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --user ${{ github.repository_owner }}

      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add assets README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
